AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AulaLista (equipo T005) - Copiloto del docente público. API Gateway HTTP API + Lambda Python 3.12 (API y
  frontend en el mismo dominio) + Lambda worker de /jobs + DynamoDB + Amazon Bedrock (API Converse).

Parameters:
  TeamId:
    Type: String
    Default: T005
    Description: Id público del equipo en el portal (lo devuelve GET /health).
  ModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: Perfil de inferencia de Bedrock usado con la API Converse.
  FoundationModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Modelo base al que enruta el perfil (para restringir el permiso InvokeModel).

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Architectures: [arm64]

Resources:
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # Procesa /jobs de forma asíncrona. Solo accede a la tabla; no usa Bedrock.
  JobWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: worker.handler
      Description: Worker de /jobs (invocación asíncrona desde la API)
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable

  AppFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: app.handler
      Description: API de AulaLista y entrega del frontend
      # API Gateway HTTP corta a los 30 s; la app reserva tiempo para responder (budget.py).
      Timeout: 29
      Environment:
        Variables:
          TEAM_ID: !Ref TeamId
          TABLE_NAME: !Ref ItemsTable
          MODEL_ID: !Ref ModelId
          JOB_WORKER_FUNCTION: !Ref JobWorkerFunction
          AULALISTA_STORE: dynamodb
          AULALISTA_GENERATOR: bedrock
          AULALISTA_JOB_MODE: lambda
          AULALISTA_DEMO_MODE: "true"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                # Solo el perfil configurado y el modelo base al que enruta (en las regiones del perfil «us.»).
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${FoundationModelId}
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt JobWorkerFunction.Arn
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: API pública de la demo (sin autenticación; datos simulados)
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

Outputs:
  ApiUrl:
    Description: URL base pública (sin barra final). Pegarla en Perfil del equipo del portal.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  TableName:
    Value: !Ref ItemsTable
  JobWorkerName:
    Value: !Ref JobWorkerFunction
